<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compra">
<meta name="theme-color" content="#e2572b">
<title>Compra</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2623;--muted:#8a817a;--accent:#e2572b;--line:#ece5dc}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--text:#f3ede6;--muted:#a39a91;--accent:#f27a50;--line:#3a3532}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:8px 0 14px}
.add{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;padding:13px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:15px;line-height:1}
.done .check{background:var(--accent);border-color:var(--accent)}
.name{flex:1;font-size:17px;word-break:break-word}
.done .name{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
.status{color:var(--muted);text-align:center;margin:30px 0;font-size:15px}
.clear{display:block;margin:20px auto 0;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 16px}
</style>
</head>
<body>
<h1>🛒 Lista de la compra</h1>
<div class="add">
  <input type="text" id="txt" placeholder="Añadir producto…" autocomplete="off" enterkeyhint="done">
  <button class="btn" id="addBtn" aria-label="Añadir">+</button>
</div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="status" id="status">Conectando…</div>
<button class="clear" id="clear" hidden>Quitar lo ya comprado</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSY0f5Sh9-WJrwzmqI8xijxRbjoqWOo9w",
  authDomain: "proyecto-app-v2.firebaseapp.com",
  projectId: "proyecto-app-v2",
  storageBucket: "proyecto-app-v2.firebasestorage.app",
  messagingSenderId: "673395941373",
  appId: "1:673395941373:web:d2024d6f515035bba04394"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const col = collection(db, "compra");

const CATS = ["Frutas y verduras","Carne y pescado","Lácteos y huevos","Pan y pasta","Despensa","Congelados","Bebidas","Limpieza e higiene","Otros"];
let cat = "Auto", items = [];
const $ = (i) => document.getElementById(i);

// Reglas para adivinar la sección. Se mira en orden: la primera que coincide gana.
const REGLAS = [
  ["Limpieza e higiene", ["sanitol","lejia","detergente","suavizante","friegasuelos","fregasuelos","limpia","lavavajillas","papel higienico","papel de cocina","papel cocina","servilleta","bayeta","estropajo","bolsas? de basura","basura","jabon","gel de","gel ducha","champu","acondicionador","desodorante","pasta de dientes","dentifrico","cepillo","colonia","compresa","tampon","panuelo","algodon","ambientador","insecticida","film","papel de aluminio","aluminio","pilas","bombilla","maquinilla","crema (hidratante|solar|de manos)","desmaquillante"]],
  ["Despensa", ["caldo","escabeche","conserva","en lata","lata de","atun","sardinilla","berberecho","anchoa","tomate (frito|triturado)","salsa de tomate","pan rallado","mermelada","confitura","patatas (fritas|chips)","aperitivo","snack","ganchitos","palomitas","(mantequilla|crema) de cacahuete"]],
  ["Pan y pasta", ["pan de "]],
  ["Congelados", ["congelad","helado","pizza","croqueta","empanadilla","nugget","san jacobo","varitas","palitos de merluza","calamares a la romana","hielo"]],
  ["Bebidas", ["agua(s)?\\b","cerveza","vino","refresco","coca ?cola","fanta","nestea","aquarius","zumo","tonica","ginebra","ron\\b","whisky","vodka","sidra","cava","tinto","gaseosa","isotonic","energetica","red bull","sprite","pepsi","mosto","limonada","kas\\b","bebida"]],
  ["Lácteos y huevos", ["huevo","yogur","leche","queso","tranchete","edam","mantequilla","nata\\b","natilla","flan","cuajada","kefir","margarina","batido","actimel"]],
  ["Carne y pescado", ["pollo","pavo","ternera","cerdo","cordero","conejo","carne","picada","hamburguesa","albondiga","salchicha","chorizo","jamon","york","fiambre","bacon","panceta","lomo","solomillo","chuleta","costilla","pechuga","muslo","contramuslo","filete","entrecot","secreto","presa\\b","longaniza","morcilla","salchichon","mortadela","pescado","salmon","merluza","bacalao","lubina","dorada","gamba","langostino","calamar","sepia","pulpo","mejillon","almeja","marisco","trucha","rape\\b","sardina","boqueron","pez espada","emperador","cazon","lenguado","surimi","palitos de cangrejo"]],
  ["Pan y pasta", ["pan\\b","barra","baguette","bollo","croissant","magdalena","pasta\\b","espagueti","macarron","fideo","tallarin","lasana","canelon","tortellini","ravioli","noodle","tortita","wrap","tortillas? de (trigo|maiz)","masa","oblea","empanada","bizcocho","donut","palmera","napolitana","ensaimada"]],
  ["Frutas y verduras", ["manzana","pera\\b","peras\\b","platano","banana","naranja","mandarina","limon","lima\\b","fresa","uva","melon","sandia","melocoton","nectarina","ciruela","kiwi","pina\\b","mango","aguacate","cereza","arandano","frambuesa","higo","fruta","verdura","ensalada","lechuga","canonigo","rucula","espinaca","tomate","cebolla","cebolleta","ajo","pimient(o|os)\\b","zanahoria","calabacin","berenjena","pepino","patata","boniato","calabaza","puerro","apio","coliflor","col(es)?\\b","repollo","lombarda","judias? verde","guisante","esparrago","alcachofa","remolacha","rabano","perejil","cilantro","albahaca","hierbabuena","maiz dulce"]],
  ["Despensa", ["arroz","legumbre","lenteja","garbanzo","alubia","harina","azucar","sal\\b","aceite","vinagre","salsa","ketchup","mayonesa","mostaza","especia","pimienta","oregano","comino","pimenton","canela","cafe","cacao","colacao","nesquik","cereal","muesli","avena","galleta","chocolate","miel\\b","nutella","frutos secos","almendra","nuez","nueces","cacahuete","pipas","aceituna","pepinillo","sofrito","sopa","crema de","pure","levadura","bicarbonato","maizena","gelatina","quinoa","cuscus","te\\b","infusion","manzanilla","poleo"]]
];

function normalizar(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function adivinarCategoria(nombre) {
  const t = normalizar(nombre);
  for (const [categoria, palabras] of REGLAS) {
    for (const p of palabras) {
      if (new RegExp("(^|[^a-z])" + p).test(t)) return categoria;
    }
  }
  return "Otros";
}

function renderChips() {
  $("chips").innerHTML = "";
  ["Auto"].concat(CATS).forEach((c) => {
    const b = document.createElement("button");
    b.className = "chip" + (c === cat ? " on" : "");
    b.textContent = c === "Auto" ? "✨ Automático" : c;
    b.onclick = () => { cat = c; renderChips(); };
    $("chips").appendChild(b);
  });
}

function render() {
  const box = $("list"); box.innerHTML = "";
  let any = false;
  CATS.forEach((c) => {
    const group = items.filter((i) => i.cat === c);
    if (!group.length) return;
    any = true;
    const h = document.createElement("h2"); h.textContent = c; box.appendChild(h);
    group.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || (a.t || 0) - (b.t || 0));
    group.forEach((it) => {
      const d = document.createElement("div"); d.className = "item" + (it.done ? " done" : "");
      const ck = document.createElement("button"); ck.className = "check"; ck.textContent = it.done ? "✓" : "";
      ck.setAttribute("aria-label", "Marcar");
      ck.onclick = () => save(() => updateDoc(doc(db, "compra", it.id), { done: !it.done }));
      const n = document.createElement("span"); n.className = "name"; n.textContent = it.name;
      const x = document.createElement("button"); x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar");
      x.onclick = () => save(() => deleteDoc(doc(db, "compra", it.id)));
      d.append(ck, n, x); box.appendChild(d);
    });
  });
  $("status").textContent = any ? "" : "La lista está vacía. ¡Añade algo arriba!";
  $("clear").hidden = !items.some((i) => i.done);
}

function save(fn) {
  fn().catch(() => { $("status").textContent = "No se pudo guardar. Inténtalo de nuevo."; });
}

function add() {
  const v = $("txt").value.trim(); if (!v) return;
  $("txt").value = "";
  const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const categoria = cat === "Auto" ? adivinarCategoria(v) : cat;
  cat = "Auto"; renderChips();
  save(() => setDoc(doc(db, "compra", id), { name: v, cat: categoria, done: false, t: Date.now() }));
}

$("addBtn").onclick = add;
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
$("clear").onclick = () => items.filter((i) => i.done).forEach((i) => save(() => deleteDoc(doc(db, "compra", i.id))));

renderChips(); render();

onSnapshot(col,
  (snap) => { items = snap.docs.map((d) => ({ ...d.data(), id: d.id })); render(); },
  () => { $("status").textContent = "Error de conexión. Revisa las reglas de Firestore."; }
);
</script>
</body>
</html>
