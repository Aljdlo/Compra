<head>
<meta charset="utf-8">

<title>Compra</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2623;--muted:#8a817a;--accent:#e2572b;--line:#ece5dc}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--text:#f3ede6;--muted:#a39a91;--accent:#f27a50;--line:#3a3532}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 14px;display:flex;align-items:center;gap:12px}
h1 svg{height:44px;width:auto;flex:none}
.add{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;padding:13px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
button{font:inherit;cursor:pointer}
.btn{background:#60a5fa;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:15px;line-height:1}
.done .check{background:var(--accent);border-color:var(--accent)}
.name{flex:1;font-size:17px;word-break:break-word}
.done .name{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
.status{color:var(--muted);text-align:center;margin:30px 0;font-size:15px}
.recent{margin:4px 0 8px}
.recent-head{width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600}
.recent .item{margin:6px 0 0}
.recent .name{color:var(--muted)}
.back{background:none;border:1px solid #60a5fa;color:#60a5fa;border-radius:999px;width:34px;height:34px;font-size:20px;line-height:1;flex:none}
.hint{color:var(--muted);font-size:14px;padding:12px 6px}
.item{position:relative}
.store-btn{background:none;border:0;padding:2px;color:var(--muted);display:flex;align-items:center;flex:none}
.store-btn svg{height:22px;width:auto;display:block}
.logo{display:flex;flex:none}
.logo svg{height:20px;width:auto;display:block}
.menu{position:absolute;right:8px;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:6px;z-index:20;min-width:210px}
.menu-opt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);padding:9px 8px;border-radius:8px;text-align:left;font-size:16px}
.menu-opt.sel{background:var(--line)}
.menu-opt svg{height:22px;width:auto;flex:none}
.menu-opt.none{color:var(--muted);font-size:14px}
</style>
</head>

function normalizar(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

function adivinarCategoria(nombre) {
  const t = normalizar(nombre);
  for (const [categoria, palabras] of REGLAS) {
    for (const p of palabras) {

    }
  }
  return "Otros";

  };
  STORES.forEach((nombre) => {
    const b = document.createElement("button");
    b.className = "menu-opt" + (it.store === nombre ? " sel" : "");
    b.innerHTML = LOGOS[nombre] + "<span></span>";
    b.lastChild.textContent = nombre + (it.store === nombre ? "  ✓" : "");
    b.onclick = elegir(nombre);
    m.appendChild(b);
  });
  if (it.store) {
    const q = document.createElement("button"); q.className = "menu-opt none";
    q.textContent = "Quitar supermercado"; q.onclick = elegir("");
    m.appendChild(q);
  }
  return m;
}

function fechaUso(i) { return i.doneAt || i.t || 0; }

function render() {
  const box = $("list"); box.innerHTML = "";
  const pendientes = items.filter((i) => !i.done);
  let any = false;
  CATS.forEach((c) => {
    const group = pendientes.filter((i) => i.cat === c);
    if (!group.length) return;
    any = true;
    const h = document.createElement("h2"); h.textContent = c; box.appendChild(h);
    group.sort((a, b) => (a.t || 0) - (b.t || 0));
    group.forEach((it) => {
      const d = document.createElement("div"); d.className = "item";
      const ck = document.createElement("button"); ck.className = "check";
      ck.setAttribute("aria-label", "Marcar como comprado");
      ck.onclick = () => marcar(it);
      const n = document.createElement("span"); n.className = "name"; n.textContent = it.name;
      const x = document.createElement("button"); x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar");
      x.onclick = () => save(() => deleteDoc(doc(db, "compra", it.id)));
      const sb = document.createElement("button"); sb.className = "store-btn";
      sb.setAttribute("aria-label", "Elegir supermercado");
      sb.innerHTML = it.store && LOGOS[it.store] ? LOGOS[it.store] : STORE_ICON;
      sb.onclick = (e) => { e.stopPropagation(); openMenu = openMenu === it.id ? null : it.id; render(); };
      d.append(ck, n, sb, x);
      if (openMenu === it.id) d.appendChild(crearMenu(it));
      box.appendChild(d);
    });
  });
  $("status").textContent = any ? "" : "La lista está vacía. ¡Añade algo arriba!";
  renderRecientes();
}

function renderRecientes() {
  const hechos = items.filter((i) => i.done).sort((a, b) => fechaUso(b) - fechaUso(a));
  $("recentHead").textContent = (recentOpen ? "▾" : "▸") + " 🕘 Recientes (" + hechos.length + ")";
  const rl = $("recentList"); rl.innerHTML = ""; rl.hidden = !recentOpen;
  if (!recentOpen) return;
  if (!hechos.length) {
    const m = document.createElement("div"); m.className = "hint";
    m.textContent = "Aquí aparecerán los productos que vayas marcando como comprados.";
    rl.appendChild(m); return;
  }
  hechos.forEach((it) => {
    const d = document.createElement("div"); d.className = "item";
    const n = document.createElement("span"); n.className = "name"; n.textContent = it.name;
    const b = document.createElement("button"); b.className = "back"; b.textContent = "+"; b.setAttribute("aria-label", "Volver a la lista");
    b.onclick = () => save(() => updateDoc(doc(db, "compra", it.id), { done: false }));
    const x = document.createElement("button"); x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar del todo");
    x.onclick = () => save(() => deleteDoc(doc(db, "compra", it.id)));
    const partes = [n];
    if (it.store && LOGOS[it.store]) { const l = document.createElement("span"); l.className = "logo"; l.innerHTML = LOGOS[it.store]; partes.push(l); }
    partes.push(b, x);
    d.append(...partes); rl.appendChild(d);
  });
}

function marcar(it) {
  save(() => updateDoc(doc(db, "compra", it.id), { done: true, doneAt: Date.now() }));
  // Guardamos solo los últimos productos usados; los más antiguos se borran solos
  const hechos = items.filter((i) => i.done && i.id !== it.id).sort((a, b) => fechaUso(b) - fechaUso(a));
  hechos.slice(MAX_RECIENTES - 1).forEach((i) => save(() => deleteDoc(doc(db, "compra", i.id))));
}

function save(fn) {
  fn().catch(() => { $("status").textContent = "No se pudo guardar. Inténtalo de nuevo."; });
}

function add() {
  const v = $("txt").value.trim(); if (!v) return;
  $("txt").value = "";
  // Si ya estaba en "recientemente utilizado", lo recuperamos en vez de duplicarlo
  const previo = items.find((i) => i.done && normalizar(i.name) === normalizar(v));
  if (previo) { save(() => updateDoc(doc(db, "compra", previo.id), { done: false })); return; }
  const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const categoria = adivinarCategoria(v);
  save(() => setDoc(doc(db, "compra", id), { name: v, cat: categoria, done: false, t: Date.now() }));
}

$("addBtn").onclick = add;
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
$("recentHead").onclick = () => {
  recentOpen = !recentOpen;
  try { localStorage.setItem("recentOpen", recentOpen ? "1" : "0"); } catch (e) {}
  renderRecientes();
};

document.addEventListener("click", () => { if (openMenu) { openMenu = null; render(); } });

render();

onSnapshot(col,
  (snap) => { items = snap.docs.map((d) => ({ ...d.data(), id: d.id })); render(); },
  () => { $("status").textContent = "Error de conexión. Revisa las reglas de Firestore."; }
);
</script>
</body>
</html>
