<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compra">
<meta name="theme-color" content="#e2572b">
<link rel="apple-touch-icon" href="icon.png">
<title>Compra</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2623;--muted:#8a817a;--accent:#e2572b;--line:#ece5dc}
@media (prefers-color-scheme:dark){:root{--bg:#1c1917;--card:#292524;--text:#f3ede6;--muted:#a39a91;--accent:#f27a50;--line:#3a3532}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 14px;display:flex;align-items:center;gap:12px}
h1 svg{height:44px;width:auto;flex:none}
.add{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;padding:13px 14px;font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
button{font:inherit;cursor:pointer}
.btn{background:#60a5fa;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;color:#fff;font-size:15px;line-height:1}
.done .check{background:var(--accent);border-color:var(--accent)}
.name{flex:1;font-size:17px;word-break:break-word}
.done .name{text-decoration:line-through;color:var(--muted)}
.del{background:none;border:0;color:var(--muted);font-size:20px;padding:0 4px}
.status{color:var(--muted);text-align:center;margin:30px 0;font-size:15px}
.recent{margin:4px 0 8px}
.recent-head{width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:600}
.recent .item{margin:6px 0 0}
.recent .name{color:var(--muted)}
.back{background:none;border:1px solid #60a5fa;color:#60a5fa;border-radius:999px;width:34px;height:34px;font-size:20px;line-height:1;flex:none}
.hint{color:var(--muted);font-size:14px;padding:12px 6px}
.item{position:relative}
.menu-btn{background:none;border:0;color:var(--text);padding:6px 4px;margin:0 0 4px -4px;display:block}
.menu-btn svg{width:32px;height:32px;display:block}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(80vw,300px);background:var(--card);border-right:1px solid var(--line);z-index:40;transform:translateX(-105%);transition:transform .2s ease;padding:calc(28px + env(safe-area-inset-top)) 14px 24px}
.drawer.open{transform:none}
.drawer-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 8px 10px}
.drawer-item{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font-size:18px;padding:14px 12px;border-radius:12px;margin-bottom:4px}
.drawer-item.on{background:var(--line);color:#60a5fa;font-weight:600}
.dia{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.dia.hoy{border-color:#60a5fa}
.fila textarea{flex:1}
.unico textarea{width:100%;display:block;margin-top:6px}
.bloque{margin-top:14px}
.bloque-cab{display:flex;align-items:center;justify-content:space-between}
.bloque-cab span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.dos-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px}
.dos-btn.on{background:#60a5fa;border-color:#60a5fa;color:#fff}
.fecha{font-weight:400;color:var(--muted)}
.semana-nav{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.semana-nav button{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;padding:0}
.semana-nav svg{width:20px;height:20px}
.semana-rango{flex:1;text-align:center;font-size:15px;line-height:1.25;font-weight:600}
.estado-sem{text-align:center;font-size:13px;color:var(--muted);margin:0 0 10px}
.estado-sem:empty{display:none}
.estado-sem.error{color:#ef4444;font-weight:600;font-size:14px;line-height:1.3}
.hoy-btn{display:block;margin:-4px auto 12px;background:none;border:0;color:#60a5fa;font-size:14px;padding:4px 8px}
.dia h3{margin:0 0 4px;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.dia.hoy h3{color:#60a5fa}
.fila{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.fila label{flex:none;width:46px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding-top:12px}
.dia textarea{min-width:0;resize:none;overflow:hidden;font:inherit;font-size:16px;line-height:1.3;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);min-height:42px}
.store-btn{background:none;border:0;padding:2px;color:var(--muted);display:flex;align-items:center;flex:none}
.store-btn svg{height:22px;width:auto;display:block}
.logo{display:flex;flex:none}
.logo svg{height:20px;width:auto;display:block}
.menu{position:absolute;right:8px;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:6px;z-index:20;width:max-content}
.menu-opt{display:flex;align-items:center;justify-content:center;width:100%;background:none;border:0;color:var(--text);padding:9px 8px;border-radius:8px;text-align:left;font-size:16px}
.menu-opt.sel{background:var(--line)}
.menu-opt svg{height:28px;width:auto;flex:none}
.menu-opt.none{color:var(--muted);font-size:14px}
</style>
</head>

<section id="vista-carro">
<div class="add">
  <input type="text" id="txt" placeholder="Añadir producto…" autocomplete="off" enterkeyhint="done">
  <button class="btn" id="addBtn" aria-label="Añadir">+</button>
</div>
<div class="recent">
  <button class="recent-head" id="recentHead"></button>
  <div id="recentList" hidden></div>
</div>
<div id="list"></div>
<div class="status" id="status">Conectando…</div>
</section>

<section id="vista-semana" hidden>
  <div class="semana-nav">
    <button id="semPrev" aria-label="Semana anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg></button>
    <div class="semana-rango" id="semRango"></div>
    <button id="semNext" aria-label="Semana siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></button>
  </div>
  <button class="hoy-btn" id="semHoy" hidden>Volver a esta semana</button>
  <div class="estado-sem" id="semanaEstado"></div>
  <div id="semana"></div>
</section>

<div class="drawer-bg" id="drawerBg" hidden></div>
<nav class="drawer" id="drawer">
  <div class="drawer-title">Menú</div>
  <button class="drawer-item" data-vista="carro">🛒 Carro de la compra</button>
  <button class="drawer-item" data-vista="semana">🍽️ Comida semanal</button>
</nav>

function normalizar(t) {
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function adivinarCategoria(nombre) {
  const t = normalizar(nombre);

  };
  STORES.forEach((nombre) => {
    const b = document.createElement("button");
    b.className = "menu-opt" + (it.store === nombre ? " sel" : "");
    b.innerHTML = LOGOS[nombre];
    b.setAttribute("aria-label", nombre);
    b.onclick = elegir(nombre);
    m.appendChild(b);
  });
  if (it.store) {
    const q = document.createElement("button"); q.className = "menu-opt none";
    q.textContent = "✕ Quitar"; q.onclick = elegir("");
    m.appendChild(q);
  }
  return m;
}

function fechaUso(i) { return i.doneAt || i.t || 0; }

function render() {
  const box = $("list"); box.innerHTML = "";
  const pendientes = items.filter((i) => !i.done);
  let any = false;
  CATS.forEach((c) => {
    const group = pendientes.filter((i) => i.cat === c);
    if (!group.length) return;
    any = true;
    const h = document.createElement("h2"); h.textContent = c; box.appendChild(h);
    group.sort((a, b) => (a.t || 0) - (b.t || 0));
    group.forEach((it) => {
      const d = document.createElement("div"); d.className = "item";
      const ck = document.createElement("button"); ck.className = "check";
      ck.setAttribute("aria-label", "Marcar como comprado");
      ck.onclick = () => marcar(it);
      const n = document.createElement("span"); n.className = "name"; n.textContent = it.name;
      const x = document.createElement("button"); x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar");
      x.onclick = () => save(() => deleteDoc(doc(db, "compra", it.id)));
      const sb = document.createElement("button"); sb.className = "store-btn";
      sb.setAttribute("aria-label", "Elegir supermercado");
      sb.innerHTML = it.store && LOGOS[it.store] ? LOGOS[it.store] : STORE_ICON;
      sb.onclick = (e) => { e.stopPropagation(); openMenu = openMenu === it.id ? null : it.id; render(); };
      d.append(ck, n, sb, x);
      if (openMenu === it.id) d.appendChild(crearMenu(it));
      box.appendChild(d);
    });
  });
  $("status").textContent = any ? "" : "La lista está vacía. ¡Añade algo arriba!";
  renderRecientes();
}

function renderRecientes() {
  const hechos = items.filter((i) => i.done).sort((a, b) => fechaUso(b) - fechaUso(a));
  $("recentHead").textContent = (recentOpen ? "▾" : "▸") + " 🕘 Recientes (" + hechos.length + ")";
  const rl = $("recentList"); rl.innerHTML = ""; rl.hidden = !recentOpen;
  if (!recentOpen) return;
  if (!hechos.length) {
    const m = document.createElement("div"); m.className = "hint";
    m.textContent = "Aquí aparecerán los productos que vayas marcando como comprados.";
    rl.appendChild(m); return;
  }
  hechos.forEach((it) => {
    const d = document.createElement("div"); d.className = "item";
    const n = document.createElement("span"); n.className = "name"; n.textContent = it.name;
    const b = document.createElement("button"); b.className = "back"; b.textContent = "+"; b.setAttribute("aria-label", "Volver a la lista");
    b.onclick = () => save(() => updateDoc(doc(db, "compra", it.id), { done: false }));
    const x = document.createElement("button"); x.className = "del"; x.textContent = "✕"; x.setAttribute("aria-label", "Borrar del todo");
    x.onclick = () => save(() => deleteDoc(doc(db, "compra", it.id)));
    const partes = [n];
    if (it.store && LOGOS[it.store]) { const l = document.createElement("span"); l.className = "logo"; l.innerHTML = LOGOS[it.store]; partes.push(l); }
    partes.push(b, x);
    d.append(...partes); rl.appendChild(d);
  });
}

function marcar(it) {
  save(() => updateDoc(doc(db, "compra", it.id), { done: true, doneAt: Date.now() }));
  // Guardamos solo los últimos productos usados; los más antiguos se borran solos
  const hechos = items.filter((i) => i.done && i.id !== it.id).sort((a, b) => fechaUso(b) - fechaUso(a));
  hechos.slice(MAX_RECIENTES - 1).forEach((i) => save(() => deleteDoc(doc(db, "compra", i.id))));
}

function save(fn) {
  fn().catch(() => { $("status").textContent = "No se pudo guardar. Inténtalo de nuevo."; });
}

function add() {
  const v = $("txt").value.trim(); if (!v) return;
  $("txt").value = "";
  // Si ya estaba en "recientemente utilizado", lo recuperamos en vez de duplicarlo
  const previo = items.find((i) => i.done && normalizar(i.name) === normalizar(v));
  if (previo) { save(() => updateDoc(doc(db, "compra", previo.id), { done: false })); return; }
  const id = "i" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const categoria = adivinarCategoria(v);
  save(() => setDoc(doc(db, "compra", id), { name: v, cat: categoria, done: false, t: Date.now() }));
}

$("addBtn").onclick = add;
$("txt").addEventListener("keydown", (e) => { if (e.key === "Enter") add(); });
$("recentHead").onclick = () => {
  recentOpen = !recentOpen;
  try { localStorage.setItem("recentOpen", recentOpen ? "1" : "0"); } catch (e) {}
  renderRecientes();
};

// ---------- Menú lateral y pantallas ----------
let vista = "carro";
try { vista = localStorage.getItem("vista") === "semana" ? "semana" : "carro"; } catch (e) {}

function abrirMenu(abierto) {
  $("drawer").classList.toggle("open", abierto);
  $("drawerBg").hidden = !abierto;
}

function mostrarVista(v) {
  vista = v;
  try { localStorage.setItem("vista", v); } catch (e) {}
  $("vista-carro").hidden = v !== "carro";
  $("vista-semana").hidden = v !== "semana";
  $("titulo").textContent = v === "carro" ? "Carro de la compra" : "Comida semanal";
  document.querySelectorAll(".drawer-item").forEach((b) => b.classList.toggle("on", b.dataset.vista === v));
  abrirMenu(false);
  if (v === "semana") pintarSemana();
}

$("menuBtn").onclick = () => abrirMenu(true);
$("drawerBg").onclick = () => abrirMenu(false);
document.querySelectorAll(".drawer-item").forEach((b) => { b.onclick = () => mostrarVista(b.dataset.vista); });

// ---------- Comida semanal ----------
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const DIA_ID = ["lunes", "martes", "miercoles", "jueves", "viernes", "sabado", "domingo"];
const TIPOS = [["comida", "Comida", "Dos comidas"], ["cena", "Cena", "Dos cenas"]];
let semanaRef = null;
let semanaOffset = 0; // 0 = esta semana, -1 = la anterior, 1 = la siguiente
let desuscribirSemana = null;
let migrado = false;
let semana = {};
const campos = {};
const temporizadores = {};

function autoAlto(t) {
  if (!t.offsetParent) return; // oculto: no se puede medir
  t.style.height = "auto";
  t.style.height = (t.scrollHeight + 2) + "px";
}

let estadoTimer = null;
function mostrarEstado(texto, error) {
  const el = $("semanaEstado");
  el.textContent = texto; el.className = "estado-sem" + (error ? " error" : "");
  clearTimeout(estadoTimer);
  if (!error) estadoTimer = setTimeout(() => { el.textContent = ""; }, 1800);
}

function guardarCampo(ref, dia, clave, valor) {
  setDoc(ref, { [dia]: { [clave]: valor } }, { merge: true })
    .then(() => mostrarEstado("✓ Guardado", false))
    .catch((e) => mostrarEstado("⚠️ No se pudo guardar (" + ((e && e.code) || "error") + "). Revisa las reglas de Firebase.", true));
}

// Lunes de la semana que se está viendo
function lunesDe(offset) {
  const h = new Date(); h.setHours(12, 0, 0, 0);
  h.setDate(h.getDate() - ((h.getDay() + 6) % 7) + offset * 7);
  return h;
}
function sumarDias(fecha, n) { const d = new Date(fecha); d.setDate(d.getDate() + n); return d; }
function idSemana(lunes) {
  const m = String(lunes.getMonth() + 1).padStart(2, "0");
  const d = String(lunes.getDate()).padStart(2, "0");
  return lunes.getFullYear() + "-" + m + "-" + d;
}
function textoFecha(nombreDia, fecha) {
  return nombreDia + " " + fecha.getDate() + " " + fecha.toLocaleDateString("es-ES", { month: "long" });
}

const bloques = {};
const pendientes = {};

function volcarPendientes() { // guarda ya lo que quedaba por guardar
  Object.keys(temporizadores).forEach((k) => clearTimeout(temporizadores[k]));
  Object.keys(pendientes).forEach((k) => { const f = pendientes[k]; delete pendientes[k]; f(); });
}

function crearCampo(dia, clave, placeholder, etiquetaAria) {
  const ref = semanaRef; // cada cuadro recuerda a qué semana pertenece
  const ta = document.createElement("textarea"); ta.rows = 1;
  ta.placeholder = placeholder;
  ta.setAttribute("aria-label", etiquetaAria);
  const k = dia + "." + clave; campos[k] = ta;
  ta.addEventListener("input", () => {
    autoAlto(ta);
    clearTimeout(temporizadores[k]);
    pendientes[k] = () => guardarCampo(ref, dia, clave, ta.value);
    temporizadores[k] = setTimeout(() => { const f = pendientes[k]; delete pendientes[k]; if (f) f(); }, 600);
  });
  ta.addEventListener("blur", () => {
    clearTimeout(temporizadores[k]); delete pendientes[k];
    if (ta.value !== ((semana[dia] || {})[clave] || "")) guardarCampo(ref, dia, clave, ta.value);
  });
  return ta;
}

function construirSemana(lunes) {
  const box = $("semana"); box.innerHTML = "";
  Object.keys(campos).forEach((k) => delete campos[k]);
  Object.keys(bloques).forEach((k) => delete bloques[k]);
  const hoy = semanaOffset === 0 ? (new Date().getDay() + 6) % 7 : -1; // lunes = 0
  DIAS.forEach((nombre, idx) => {
    const dia = DIA_ID[idx];
    const fecha = sumarDias(lunes, idx);
    const ref = semanaRef;
    const card = document.createElement("div"); card.className = "dia" + (idx === hoy ? " hoy" : "");
    const h = document.createElement("h3"); h.textContent = nombre + " ";
    const f = document.createElement("span"); f.className = "fecha";
    f.textContent = fecha.getDate() + " de " + fecha.toLocaleDateString("es-ES", { month: "long" }) + (idx === hoy ? " · hoy" : "");
    h.appendChild(f); card.appendChild(h);

    TIPOS.forEach(([tipo, etiqueta, textoBoton]) => {
      const bloque = document.createElement("div"); bloque.className = "bloque";
      const cab = document.createElement("div"); cab.className = "bloque-cab";
      const t = document.createElement("span"); t.textContent = etiqueta;
      const btn = document.createElement("button"); btn.className = "dos-btn"; btn.textContent = textoBoton;
      btn.onclick = () => {
        const activo = !((semana[dia] || {})[tipo + "_dos"]);
        semana[dia] = Object.assign({}, semana[dia], { [tipo + "_dos"]: activo });
        pintarSemana();
        guardarCampo(ref, dia, tipo + "_dos", activo);
      };
      cab.append(t, btn); bloque.appendChild(cab);

      const unico = document.createElement("div"); unico.className = "unico";
      unico.appendChild(crearCampo(dia, tipo, "Escribe la " + tipo + "…", etiqueta + " del " + nombre.toLowerCase()));

      const dual = document.createElement("div"); dual.hidden = true;
      [["alex", "Alex"], ["ana", "Ana"]].forEach(([q, nombrePersona]) => {
        const fila = document.createElement("div"); fila.className = "fila";
        const l = document.createElement("label"); l.textContent = nombrePersona;
        const ta = crearCampo(dia, tipo + "_" + q, "Escribe la " + tipo + " de " + nombrePersona + "…", nombrePersona + ": " + etiqueta + " del " + nombre.toLowerCase());
        fila.append(l, ta); dual.appendChild(fila);
      });

      bloque.append(unico, dual); card.appendChild(bloque);
      bloques[dia + "." + tipo] = { btn, unico, dual };
    });
    box.appendChild(card);
  });
}

// Si había un menú guardado con la versión anterior, pasa a la semana actual (solo una vez)
async function migrarMenuAntiguo(ref) {
  if (migrado) return; migrado = true;
  try {
    const viejoRef = doc(db, "menu", "semana");
    const viejo = await getDoc(viejoRef);
    if (viejo.exists()) { await setDoc(ref, viejo.data(), { merge: true }); await deleteDoc(viejoRef); }
  } catch (e) {}
}

function cargarSemana() {
  if (desuscribirSemana) desuscribirSemana();
  const lunes = lunesDe(semanaOffset);
  const ref = doc(db, "menu", idSemana(lunes));
  semanaRef = ref; semana = {};
  $("semRango").textContent = textoFecha("lunes", lunes) + " – " + textoFecha("domingo", sumarDias(lunes, 6));
  $("semHoy").hidden = semanaOffset === 0;
  $("semanaEstado").textContent = ""; $("semanaEstado").className = "estado-sem";
  construirSemana(lunes);
  pintarSemana();
  desuscribirSemana = onSnapshot(ref,
    (snap) => {
      if (ref !== semanaRef) return;
      if (!snap.exists() && semanaOffset === 0) migrarMenuAntiguo(ref);
      semana = snap.exists() ? snap.data() : {};
      pintarSemana();
    },
    (e) => mostrarEstado("⚠️ No se puede leer la semana (" + ((e && e.code) || "error") + "). Revisa las reglas de Firebase.", true)
  );
}

function cambiarSemana(delta) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  volcarPendientes();
  semanaOffset = delta === 0 ? 0 : semanaOffset + delta;
  cargarSemana();
}

function pintarSemana() {
  // 1) mostrar un campo o dos según el botón
  DIA_ID.forEach((dia) => TIPOS.forEach(([tipo]) => {
    const b = bloques[dia + "." + tipo]; if (!b) return;
    const dos = !!(semana[dia] || {})[tipo + "_dos"];
    b.unico.hidden = dos; b.dual.hidden = !dos;
    b.btn.classList.toggle("on", dos);
    b.btn.setAttribute("aria-pressed", dos ? "true" : "false");
  }));
  // 2) rellenar los textos (sin pisar lo que se está escribiendo)
  Object.keys(campos).forEach((k) => {
    const [dia, clave] = k.split(".");
    const ta = campos[k];
    const v = (semana[dia] || {})[clave] || "";
    if (document.activeElement !== ta && ta.value !== v) ta.value = v;
    autoAlto(ta);
  });
}

$("semPrev").onclick = () => cambiarSemana(-1);
$("semNext").onclick = () => cambiarSemana(1);
$("semHoy").onclick = () => cambiarSemana(0);
cargarSemana();
mostrarVista(vista);

document.addEventListener("click", () => { if (openMenu) { openMenu = null; render(); } });

render();

onSnapshot(col,
  (snap) => { items = snap.docs.map((d) => ({ ...d.data(), id: d.id })); render(); },
  () => { $("status").textContent = "Error de conexión. Revisa las reglas de Firestore."; }
);
</script>
</body>
